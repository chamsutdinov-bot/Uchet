<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#141312;color:#f1ece5;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{min-height:100%;padding:3vh 4vw;display:flex;flex-direction:column;gap:2.4vh}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.cap{font-size:clamp(14px,1.8vw,22px);color:#a69f95;letter-spacing:.04em;text-transform:uppercase}
h1{margin:4px 0 0;font-size:clamp(28px,4.6vw,56px);font-weight:700;line-height:1.1}
.clock{text-align:right}
.clock b{display:block;font-size:clamp(40px,7vw,84px);line-height:1;color:#d6a36a}
.clock span{font-size:clamp(14px,1.8vw,22px);color:#a69f95}
.glass{border:1px solid rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 10px 24px -10px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:2vh 2vw;flex-grow:1;align-content:stretch}
.tile{border-radius:28px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;position:relative;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile b{font-size:clamp(28px,3.6vw,46px)}
.tile small{font-size:clamp(14px,1.7vw,22px);color:#a69f95}
.tile.in{background:linear-gradient(180deg,rgba(76,196,110,.92),rgba(31,157,69,.88));border-color:rgba(255,255,255,.45);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 14px 30px -10px rgba(0,0,0,.6)}
.tile.in small,.tile.in b{color:#fff}
.tile.inst{background:linear-gradient(180deg,rgba(64,170,255,.92),rgba(30,90,235,.88));border-color:rgba(255,255,255,.45)}
.tile.inst small,.tile.inst b{color:#fff}
.tile.out{opacity:.62}
.badge{position:absolute;top:12px;right:14px;background:#ff9f1c;color:#1b1713;font-weight:700;border-radius:999px;padding:6px 14px;font-size:clamp(13px,1.5vw,19px)}
.hint{font-size:clamp(13px,1.6vw,20px);color:#a69f95}
.btn{padding:14px 26px;border-radius:18px;font-weight:700;font-size:clamp(16px,2vw,24px)}
.btn.g{background:linear-gradient(180deg,rgba(76,196,110,.95),rgba(31,157,69,.9));color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.btn.r{background:linear-gradient(180deg,rgba(255,110,90,.95),rgba(205,50,40,.9));color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.btn.b{background:linear-gradient(180deg,rgba(64,170,255,.95),rgba(30,90,235,.9));color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.btn.o{background:linear-gradient(180deg,rgba(255,176,46,.95),rgba(240,110,20,.9));color:#1b1713;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.btn.a{background:linear-gradient(180deg,#e6b87e,#c88b4c);color:#1b1713}
.btn[disabled]{opacity:.4}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:14px}
.card{display:flex;align-items:center;gap:20px;padding:18px 24px;border-radius:22px}
.card .no{font-size:clamp(24px,3vw,38px);font-weight:700;min-width:110px}
.card .tx{flex-grow:1;min-width:0}
.card .tx b{font-size:clamp(17px,2.1vw,26px);font-weight:600}
.card .tx div{font-size:clamp(13px,1.6vw,19px);color:#a69f95;margin-top:3px}
.chip{padding:10px 20px;border-radius:999px;font-weight:700;font-size:clamp(14px,1.7vw,21px);background:rgba(214,163,106,.25);color:#d6a36a;white-space:nowrap}
.chip.n{background:rgba(255,255,255,.12);color:#a69f95}.chip.ok{background:rgba(76,196,110,.25);color:#7fe39c}.chip.bl{background:rgba(64,170,255,.22);color:#6fbaff}.chip.or{background:rgba(255,159,28,.25);color:#ffb84d}
.srch{width:100%;padding:16px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#f1ece5;font-size:clamp(16px,2vw,24px);-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:20px;padding:18px 26px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.row.done{background:linear-gradient(180deg,rgba(76,196,110,.33),rgba(31,157,69,.22));border-color:rgba(76,196,110,.6)}
.row.cur{background:linear-gradient(180deg,rgba(214,163,106,.3),rgba(214,163,106,.14));border:2px solid #d6a36a}
.row .ck{width:48px;height:48px;border-radius:13px;border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;flex-shrink:0}
.row.done .ck{background:#2fbf61;border-color:#2fbf61;color:#fff}.row.cur .ck{border-color:#d6a36a}
.row .nm{flex-grow:1;font-size:clamp(20px,2.6vw,32px);font-weight:700}
.row .nm small{display:block;font-size:clamp(13px,1.5vw,19px);font-weight:500;color:#a69f95;margin-top:3px}
.row.done .nm small{color:#9fe3b3}
.mut{color:#a69f95}
.note{width:100%;min-height:120px;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#f1ece5;font:inherit;font-size:clamp(16px,2vw,24px);-webkit-user-select:text;user-select:text}
.sync{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:14px;color:#a69f95;pointer-events:none}
.gear{position:fixed;right:10px;bottom:calc(6px + env(safe-area-inset-bottom));background:none;font-size:22px;opacity:.35;padding:10px}
.ov{position:fixed;inset:0;background:#141312;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .box{width:min(92vw,440px);display:flex;flex-direction:column;gap:14px;text-align:center}
.ov input{padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#f1ece5;font-size:22px;text-align:center;-webkit-user-select:text;user-select:text}
.err{color:#ff8a80;min-height:22px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:18px 0;border-radius:16px;font-size:28px;font-weight:600}
.sel{display:flex;align-items:center;gap:18px}
.sel .ck{width:44px;height:44px;border-radius:12px;border:3px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;flex-shrink:0}
.card.on{border-color:#6fbaff;background:rgba(64,170,255,.18)}.card.on .ck{background:#3b9bff;border-color:#3b9bff;color:#fff}
.sm{font-size:clamp(14px,1.7vw,21px)}
.st{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.st input{flex:1;padding:12px 14px;font-size:20px;text-align:left}
</style>

</script>

<body>
<div id="app"></div>
<div class="sync" id="sync"></div>
<button class="gear" id="gear" aria-label="Настройки">⚙︎</button>
<div id="ov"></div>
<script>
"use strict";
/* ===== настройки ===== */
const REPO="chamsutdinov-bot/uchet-data",KEYN="uchet_gh_m",ACC="access.json";
const PWH="d17f25ecfbcc7857f7bebea469308be0b2580943e96d13a3ad98a13675c4bfc2";
const STAGES=[["rasp","Распил"],["skl","Склейка"],["obr","Обработка и шлифовка"],["gotov","Готово к выдаче"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>{d=new Date(d);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const ymOf=d=>ymd(d).slice(0,7).replace("-","");
const hm=t=>{const d=new Date(t);return pad2(d.getHours())+":"+pad2(d.getMinutes())};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const key=()=>{try{return localStorage.getItem(KEYN)||""}catch(e){return""}};

/* ===== доступ к данным (GitHub) ===== */
const API="https://api.github.com/repos/"+REPO+"/contents/data/";
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
const H=x=>({Authorization:"Bearer "+key(),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(x||{})});
const cache={};
async function load(c,force){
  const cur=cache[c],h=H();if(cur&&cur.etag&&!force)h["If-None-Match"]=cur.etag;
  const r=await fetch(API+encodeURIComponent(c)+".json",{headers:h,cache:"no-store"});
  if(r.status===304)return{...cur,changed:false};
  if(r.status===404){const e={obj:{},sha:null,etag:null};const ch=!cur||Object.keys(cur.obj).length>0;cache[c]=e;return{...e,changed:ch}}
  if(r.status===401){const er=new Error("auth");er.auth=true;throw er}
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();let txt;
  if(j.content&&j.encoding==="base64")txt=b64d(j.content);
  else{const rr=await fetch(API+encodeURIComponent(c)+".json",{headers:H({Accept:"application/vnd.github.raw+json"}),cache:"no-store"});txt=await rr.text()}
  let obj={};try{obj=JSON.parse(txt)||{}}catch(e){}
  const e={obj,sha:j.sha,etag:r.headers.get("ETag")};cache[c]=e;return{...e,changed:true};
}
const qMut={};
function mutate(c,fn){
  const run=async()=>{
    let last;
    for(let i=0;i<6;i++){
      const cur=await load(c,true),obj=JSON.parse(JSON.stringify(cur.obj));fn(obj);
      const body={message:"master: "+c,content:b64e(JSON.stringify(obj))};if(cur.sha)body.sha=cur.sha;
      const r=await fetch(API+encodeURIComponent(c)+".json",{method:"PUT",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body),cache:"no-store"});
      if(r.ok){const j=await r.json();cache[c]={obj,sha:j.content.sha,etag:null};return}
      last=new Error("HTTP "+r.status);
      if(r.status===409||r.status===422){await new Promise(z=>setTimeout(z,300+Math.random()*500));continue}
      if(r.status===401){const er=new Error("auth");er.auth=true;throw er}
      break;
    }
    throw last||new Error("save");
  };
  const p=(qMut[c]||Promise.resolve()).then(run,run);qMut[c]=p.catch(()=>{});return p;
}

/* ===== данные и очередь записи ===== */
let staff={},orders={},stage={},logs={};          // базовые снимки с сервера
let pend=[];try{pend=JSON.parse(localStorage.getItem("m_q")||"[]")}catch(e){}
const savePend=()=>{try{localStorage.setItem("m_q",JSON.stringify(pend))}catch(e){}};
function deepMerge(t,s){for(const k in s){const v=s[k];if(v===null)delete t[k];else if(typeof v==="object"&&!Array.isArray(v)){if(typeof t[k]!=="object"||t[k]===null||Array.isArray(t[k]))t[k]={};deepMerge(t[k],v)}else t[k]=v}return t}
let L={staff:{},orders:{},stage:{},log:{}};     // с учётом ещё не отправленного
function rebuild(){
  L.staff=JSON.parse(JSON.stringify(staff));L.orders=orders;L.stage=JSON.parse(JSON.stringify(stage));
  L.log={};for(const c in logs)Object.assign(L.log,logs[c]);
  for(const op of pend){
    if(op.k==="ev"){const o=L.log[op.id]||(L.log[op.id]={});Object.assign(o,op.d)}
    else if(op.k==="ms"){const t=L.stage[op.o]||(L.stage[op.o]={});deepMerge(t,op.m)}
    else if(op.k==="ms0"){delete L.stage[op.o]}
    else if(op.k==="st"){if(op.d===null)delete L.staff[op.id];else L.staff[op.id]=op.d}
  }
}
let flushing=false,netErr="";
async function flush(){
  if(flushing||!pend.length)return;flushing=true;
  try{
    while(pend.length){
      const op=pend[0];
      if(op.k==="ev")await mutate("mlog_"+op.ym,o=>{o[op.id]={...(o[op.id]||{}),...op.d}});
      else if(op.k==="ms")await mutate("mstage",o=>{deepMerge(o[op.o]||(o[op.o]={}),op.m)});
      else if(op.k==="ms0")await mutate("mstage",o=>{delete o[op.o]});
      else if(op.k==="st")await mutate("mstaff",o=>{if(op.d===null)delete o[op.id];else o[op.id]=op.d});
      pend.shift();savePend();netErr="";
    }
  }catch(e){netErr=e.auth?"auth":"net";if(e.auth){try{localStorage.removeItem(KEYN)}catch(x){}login("Войдите снова")}}
  flushing=false;rebuild();paintSync();
}
function push(...ops){pend.push(...ops);savePend();rebuild();draw();paintSync();flush()}
function paintSync(){const n=pend.length;$("sync").textContent=n?(netErr?"Нет связи · в очереди: "+n:"Отправка…"):"";}
function evOp(d){const t=Date.now();return{k:"ev",ym:ymOf(t),id:newId(),d:{ts:t,d:ymd(t),...d}}}

/* ===== загрузка ===== */
const months=()=>{const n=new Date();const p=new Date(n.getFullYear(),n.getMonth()-1,1);return[ymOf(n),ymOf(p)]};
async function pull(){
  try{
    const m=months();
    const rs=await Promise.all([load("mstaff"),load("orders"),load("mstage"),load("mlog_"+m[0]),load("mlog_"+m[1])]);
    staff=rs[0].obj;orders=rs[1].obj;stage=rs[2].obj;logs={};logs[m[0]]=rs[3].obj;logs[m[1]]=rs[4].obj;
    if(rs.some(r=>r.changed)||true){rebuild();autoClose();draw()}
    netErr=pend.length?netErr:"";
  }catch(e){if(e.auth){try{localStorage.removeItem(KEYN)}catch(x){}login("Войдите снова")}else netErr="net"}
  paintSync();
}

/* ===== вычисления ===== */
const mEvents=(mid,d)=>Object.values(L.log).filter(e=>e.m===mid&&e.d===d).sort((a,b)=>a.ts-b.ts);
function dayState(mid,d){
  const ev=mEvents(mid,d).filter(e=>["in","out","autoout","inst_out"].includes(e.ty));
  const last=ev[ev.length-1];if(!last)return{s:"none"};
  if(last.ty==="in")return{s:"in",ts:last.ts};
  if(last.ty==="inst_out")return{s:"inst",ts:last.ts};
  return{s:"out",ts:last.ts,auto:last.ty==="autoout"};
}
function pendingConf(mid){
  const r=[];for(const o in L.stage){const i=L.stage[o].ins;if(i&&i.out&&i.out[mid]&&ymd(i.out[mid].ts)<ymd(Date.now())&&!(i.conf&&i.conf[mid]))r.push(o)}
  return r.filter(o=>L.orders[o]);
}
function curStage(o){const s=(L.stage[o]||{}).stages||{};for(const [k] of STAGES)if(!s[k])return k;return null}
function statusOf(o){
  const st=L.stage[o]||{},i=st.ins,s=st.stages||{};
  if(i&&i.status==="done")return["Установлен","ok"];
  if(i&&i.status==="tails")return["Хвосты","or"];
  if(i&&i.status==="out")return["На установке","bl"];
  const c=curStage(o);
  if(!c)return["Ждёт установки","a"];
  if(c==="rasp"&&!st.start)return["Не начат","n"];
  return[STAGES.find(x=>x[0]===c)[1],""];
}
const ordName=o=>{const x=L.orders[o]||{};return"№"+(x.no||"?")+" · "+((x.fn||"")+" "+(x.ln||"")).trim()};
const ordSub=o=>{const x=L.orders[o]||{};return[x.mt,x.sl?x.sl+" слэб.":"",x.date].filter(Boolean).join(" · ")};
function openOrders(q){
  const lim=Date.now()-120*864e5;q=(q||"").toLowerCase().trim();
  return Object.keys(L.orders).filter(o=>{
    const x=L.orders[o],s=L.stage[o];
    if(s&&s.ins&&s.ins.status==="done")return false;
    if(!s&&(x.us||(x.ts&&x.ts<lim)))return false;
    if(!q)return true;
    return((x.no||"")+" "+(x.fn||"")+" "+(x.ln||"")+" "+(x.ph||"")).toLowerCase().includes(q);
  }).sort((a,b)=>(L.orders[b].ts||0)-(L.orders[a].ts||0));
}
/* автозакрытие дня в 24:00 */
function autoClose(){
  const today=ymd(Date.now()),ops=[];
  const days={};
  Object.values(L.log).forEach(e=>{if(e.m&&e.d&&e.d<today)(days[e.m+"|"+e.d]=days[e.m+"|"+e.d]||[]).push(e)});
  for(const k in days){
    const ev=days[k].filter(e=>["in","out","autoout","inst_out"].includes(e.ty)).sort((a,b)=>a.ts-b.ts),last=ev[ev.length-1];
    if(last&&last.ty==="in"){
      const [m,d]=k.split("|"),dt=new Date(d+"T00:00:00");dt.setDate(dt.getDate()+1);
      ops.push({k:"ev",ym:ymOf(dt.getTime()-1),id:newId(),d:{m,d,ty:"autoout",ts:dt.getTime()-1}});
    }
  }
  if(ops.length){pend.push(...ops);savePend();rebuild();flush()}
}

/* ===== экраны ===== */
let V={n:"home"},tapT=null,tapM=null,q="";
const draw=()=>{if(!key())return;
  const a=$("app"),f=document.activeElement;if(f&&(f.tagName==="INPUT"||f.tagName==="TEXTAREA")&&V.n!=="home")return;
  ({home:drawHome,master:drawMaster,order:drawOrder,inst:drawInst,tails:drawTails})[V.n]();
};
const days=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"],mon=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const dateStr=()=>{const d=new Date();return days[d.getDay()]+", "+d.getDate()+" "+mon[d.getMonth()]};
function drawHome(){
  const today=ymd(Date.now()),ids=Object.keys(L.staff).sort((a,b)=>(L.staff[a].o||0)-(L.staff[b].o||0));
  const tiles=ids.map(id=>{
    const m=L.staff[id],s=dayState(id,today),pc=pendingConf(id).length;
    let cls="glass",sub="Нажмите — «Я пришёл»";
    if(s.s==="in"){cls="in";sub="Пришёл в "+hm(s.ts)}
    else if(s.s==="inst"){cls="inst";sub="На установке"}
    else if(s.s==="out"){cls="glass out";sub=s.auto?"Забыл отметить уход":"Ушёл в "+hm(s.ts)}
    return`<button class="tile ${cls}" data-m="${id}">${pc?`<span class="badge">Подтвердить установку: ${pc}</span>`:""}<b>${esc(m.n)}</b><small>${sub}</small></button>`;
  }).join("");
  $("app").innerHTML=`<div class="top"><div><div class="cap">Цех · Interstone</div><h1>Нажмите своё имя</h1></div><div class="clock"><b id="clk">${hm(Date.now())}</b><span>${dateStr()}</span></div></div>
  <div class="grid">${tiles||'<div class="hint">Мастеров пока нет. Нажмите ⚙︎ внизу справа и добавьте имена.</div>'}</div>
  <div class="hint">Один раз — «Я пришёл», плитка станет зелёной. Два раза подряд — ваша страница с заказами.</div>`;
}
function openMaster(id){V={n:"master",m:id};q="";draw();window.scrollTo(0,0)}
function drawMaster(){
  const id=V.m,m=L.staff[id];if(!m){V={n:"home"};return draw()}
  const today=ymd(Date.now()),s=dayState(id,today),pc=pendingConf(id);
  const stTxt=s.s==="in"?"Пришёл в "+hm(s.ts):s.s==="out"?(s.auto?"Забыл отметить уход":"Ушёл в "+hm(s.ts)):s.s==="inst"?"Сегодня установка":"Приход не отмечен";
  const list=openOrders(q).slice(0,40);
  $("app").innerHTML=`<div class="top"><div><div class="cap">${esc(stTxt)}</div><h1>${esc(m.n)}</h1></div>
  <div class="bar"><button class="btn glass" data-a="home">← Назад</button>${s.s==="in"?'<button class="btn r" data-a="leave">Я ушёл</button>':s.s!=="inst"?'<button class="btn g" data-a="arrive">Я пришёл</button>':""}<button class="btn b" data-a="inst">Установка</button></div></div>
  ${pc.length?`<div class="list">${pc.map(o=>`<div class="card glass" style="border-color:#ff9f1c"><div class="no">${esc((L.orders[o]||{}).no||"")}</div><div class="tx"><b>Подтвердите установку · ${esc(ordName(o))}</b><div>Вы выезжали на этот заказ. Всё установлено?</div></div><button class="btn g" data-a="conf" data-o="${o}">Установлено</button><button class="btn o" data-a="tails" data-o="${o}">Не полностью</button></div>`).join("")}</div>`:""}
  <input class="srch" id="q" placeholder="Поиск заказа: номер, имя, телефон" value="${esc(q)}">
  <div class="list">${list.map(o=>{const[t,c]=statusOf(o);return`<div class="card glass"><div class="no">${esc((L.orders[o]||{}).no||"")}</div><div class="tx"><b>${esc(ordName(o).replace(/^№[^·]*· /,""))}</b><div>${esc(ordSub(o))}</div></div><span class="chip ${c}">${t}</span><button class="btn a" data-a="open" data-o="${o}">Открыть</button></div>`}).join("")||'<div class="hint">Заказов не найдено</div>'}</div>`;
  const qi=$("q");qi.oninput=()=>{q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{const pos=qi.selectionStart;drawMasterList();},250)};
}
function drawMasterList(){ // перерисовка списка без потери фокуса
  const keep=document.activeElement===$("q");const c=$("app").querySelectorAll(".list");const l=c[c.length-1];if(!l)return;
  const list=openOrders(q).slice(0,40);
  l.innerHTML=list.map(o=>{const[t,cl]=statusOf(o);return`<div class="card glass"><div class="no">${esc((L.orders[o]||{}).no||"")}</div><div class="tx"><b>${esc(ordName(o).replace(/^№[^·]*· /,""))}</b><div>${esc(ordSub(o))}</div></div><span class="chip ${cl}">${t}</span><button class="btn a" data-a="open" data-o="${o}">Открыть</button></div>`}).join("")||'<div class="hint">Заказов не найдено</div>';
}
function drawOrder(){
  const o=V.o,st=L.stage[o]||{},s=st.stages||{},cur=curStage(o);
  const mn=id=>(L.staff[id]||{}).n||"";
  const done=STAGES.filter(([k])=>s[k]);const last=done.length?done[done.length-1][0]:null;
  const rows=STAGES.map(([k,n])=>{
    const x=s[k];
    if(x)return`<div class="row done"><div class="ck">✓</div><div class="nm">${n}<small>${new Date(x.ts).getDate()} ${mon[new Date(x.ts).getMonth()]}, ${hm(x.ts)} · ${esc(mn(x.m))}</small></div>${k===last&&Date.now()-x.ts<6e5&&!(st.ins)?`<button class="btn glass" data-a="undo" data-k="${k}">Отменить</button>`:""}</div>`;
    if(k===cur){
      const needStart=k==="rasp"&&!st.start;
      return`<div class="row cur"><div class="ck"></div><div class="nm">${n}<small>${needStart?"ещё не начат":"сейчас в работе"+(st.start&&k==="rasp"?" · с "+hm(st.start.ts):"")}</small></div>${needStart?`<button class="btn a" data-a="start">Начать</button>`:`<button class="btn g" data-a="stage" data-k="${k}">Готово</button>`}</div>`;
    }
    return`<div class="row"><div class="ck"></div><div class="nm mut">${n}</div></div>`;
  }).join("");
  const i=st.ins;let insTxt="Ещё не было выезда на установку",cls="";
  if(i){
    const outs=Object.keys(i.out||{});
    insTxt=outs.map(m=>{const c=(i.conf||{})[m];return esc(mn(m))+" — "+(c?(c.full?"установлено":"не полностью"+(c.note?": "+esc(c.note):"")):"ждёт подтверждения")}).join("<br>");
    cls=i.status==="done"?"done":"cur";
  }
  $("app").innerHTML=`<div class="top"><div><div class="cap">${esc(ordSub(V.o))}</div><h1>${esc(ordName(V.o))}</h1></div><button class="btn glass" data-a="back">← К заказам</button></div>
  <div class="hint" style="font-size:clamp(15px,1.9vw,22px)">Нажмите «Готово», когда этап закончен. Время запишется само, менеджер увидит сразу.</div>
  <div class="list">${rows}<div class="row ${cls}"><div class="ck">${i&&i.status==="done"?"✓":""}</div><div class="nm">Установка у клиента<small style="${i&&i.status==="done"?"":"color:#a69f95"}">${insTxt}</small></div></div></div>`;
}
function drawInst(){
  const list=openOrders(q).slice(0,40),sel=V.sel||(V.sel={});
  $("app").innerHTML=`<div class="top"><div><div class="cap">${esc((L.staff[V.m]||{}).n||"")}</div><h1>Что везёте на установку?</h1></div><button class="btn glass" data-a="mback">← Назад</button></div>
  <input class="srch" id="q" placeholder="Поиск заказа: номер, имя, телефон" value="${esc(q)}">
  <div class="list" id="il">${instList(list,sel)}</div>
  <div class="bar"><button class="btn b" data-a="instgo" ${Object.keys(sel).length?"":"disabled"} id="igo">Готово — выехал (${Object.keys(sel).length})</button></div>
  <div class="hint">Время прихода и ухода в день установки не записывается.</div>`;
  const qi=$("q");qi.oninput=()=>{q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{$("il").innerHTML=instList(openOrders(q).slice(0,40),V.sel)},250)};
}
const instList=(list,sel)=>list.map(o=>`<div class="card glass sel ${sel[o]?"on":""}" data-a="pick" data-o="${o}"><div class="ck">${sel[o]?"✓":""}</div><div class="no">${esc((L.orders[o]||{}).no||"")}</div><div class="tx"><b>${esc(ordName(o).replace(/^№[^·]*· /,""))}</b><div>${esc(ordSub(o))}</div></div><span class="chip ${statusOf(o)[1]}">${statusOf(o)[0]}</span></div>`).join("")||'<div class="hint">Заказов не найдено</div>';
function drawTails(){
  $("app").innerHTML=`<div class="top"><div><div class="cap">${esc((L.staff[V.m]||{}).n||"")}</div><h1>Не всё установлено</h1></div></div>
  <div class="hint" style="font-size:clamp(16px,2vw,24px)">${esc(ordName(V.o))}. Что осталось? Можно не писать.</div>
  <textarea class="note" id="tn" placeholder="Например: не поставили мойку, нужна герметизация"></textarea>
  <div class="bar"><button class="btn o" data-a="tailsgo">Отправить</button><button class="btn glass" data-a="mback">Отмена</button></div>`;
}

/* ===== действия ===== */
function act(a,el){
  const m=V.m,today=ymd(Date.now());
  if(a==="home"){V={n:"home"};draw();return}
  if(a==="mback"){V={n:"master",m};draw();return}
  if(a==="arrive"){push(evOp({m,ty:"in"}));return}
  if(a==="leave"){push(evOp({m,ty:"out"}));V={n:"home"};draw();return}
  if(a==="open"){V={n:"order",m,o:el.dataset.o};draw();return}
  if(a==="back"){V={n:"master",m};draw();return}
  if(a==="inst"){V={n:"inst",m,sel:{}};q="";draw();return}
  if(a==="pick"){const o=el.dataset.o;if(V.sel[o])delete V.sel[o];else V.sel[o]=1;draw();return}
  if(a==="instgo"){
    const ops=[];const t=Date.now();
    for(const o of Object.keys(V.sel)){
      const i=(L.stage[o]||{}).ins;
      ops.push(evOp({m,ty:"inst_out",o}));
      if(i&&i.status==="tails")ops.push({k:"ms",o,m:{ins:null}});
      const fresh=!i||i.status==="tails";
      ops.push({k:"ms",o,m:{ins:{status:"out",round:fresh?((i&&i.round)||0)+1:((i&&i.round)||1),out:{[m]:{ts:t}}}}});
      if(i&&i.status==="tails")ops.push({k:"ms",o,m:{ins:{conf:null}}});
    }
    push(...ops);V={n:"home"};draw();return;
  }
  if(a==="conf"||a==="tailsgo"){
    const o=a==="conf"?el.dataset.o:V.o,full=a==="conf",note=a==="tailsgo"?($("tn").value||"").trim():"";
    const i=(L.stage[o]||{}).ins||{},conf={...(i.conf||{}),[m]:{ts:Date.now(),full,note}};
    const outs=Object.keys(i.out||{}),all=outs.every(x=>conf[x]);
    const status=all?(outs.every(x=>conf[x].full)?"done":"tails"):"out";
    push(evOp({m,ty:"inst_conf",o,full,note}),{k:"ms",o,m:{ins:{conf:{[m]:{ts:Date.now(),full,note}},status}}});
    V={n:"master",m};draw();return;
  }
  if(a==="tails"){V={n:"tails",m,o:el.dataset.o};draw();return}
  if(a==="start"){const o=V.o,t=Date.now();push(evOp({m,ty:"start",o}),{k:"ms",o,m:{start:{ts:t,m}}});return}
  if(a==="stage"){const o=V.o,k=el.dataset.k,t=Date.now();
    push(evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{stages:{[k]:{ts:t,m}}}});
    if(k==="gotov"){V={n:"master",m};draw()}return}
  if(a==="undo"){const o=V.o,k=el.dataset.k;push(evOp({m,ty:"unstage",o,st:k}),{k:"ms",o,m:{stages:{[k]:null}}});return}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-m]");
  if(t&&V.n==="home"){
    const id=t.dataset.m;
    if(tapT&&tapM===id){clearTimeout(tapT);tapT=null;tapM=null;openMaster(id);return}
    clearTimeout(tapT);tapM=id;
    tapT=setTimeout(()=>{tapT=null;tapM=null;
      const s=dayState(id,ymd(Date.now()));
      if(s.s==="in")return;                                  // уже отмечен
      push(evOp({m:id,ty:"in"}));
    },320);
    return;
  }
  const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b);
});
setInterval(()=>{const c=$("clk");if(c)c.textContent=hm(Date.now());if(V.n==="home"&&!document.hidden){}},10000);
setInterval(()=>{autoClose()},30000);
setInterval(()=>{if(!document.hidden&&key()){pull();flush()}},8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&key()){pull();flush()}});
addEventListener("online",()=>{flush();pull()});

/* ===== вход (один раз на планшете) и настройки ===== */
async function openAccess(A,pw){
  try{
    const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(A.s),iterations:A.i||300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(A.v)},k,b(A.c)));
  }catch(e){return null}
}
function login(msg){
  $("ov").innerHTML=`<div class="ov"><div class="box"><h1 style="font-size:32px">Цех · Interstone</h1><div class="hint">Введите пароль доступа. Это нужно один раз на этом планшете.</div><input id="lp" type="password" inputmode="numeric" placeholder="Пароль" autocomplete="off"><div class="err" id="le">${esc(msg||"")}</div><button class="btn a" id="lg">Войти</button></div></div>`;
  const go=async()=>{
    const pw=$("lp").value.trim();if(!pw)return;$("le").textContent="Проверяю…";
    try{
      const ar=await fetch(ACC,{cache:"no-store"});const t=await openAccess(await ar.json(),pw);
      if(!t){$("le").textContent="Неверный пароль";return}
      const r=await fetch("https://api.github.com/repos/"+REPO,{headers:{Authorization:"Bearer "+t},cache:"no-store"});
      if(!r.ok){$("le").textContent="Нет доступа к базе ("+r.status+")";return}
      localStorage.setItem(KEYN,t);$("ov").innerHTML="";start();
    }catch(e){$("le").textContent="Нет связи. Проверьте интернет"}
  };
  $("lg").onclick=go;$("lp").onkeydown=e=>{if(e.key==="Enter")go()};
}
function adminPw(){
  return new Promise(res=>{
    let v="";
    const paint=()=>{$("ov").innerHTML=`<div class="ov"><div class="box"><h1 style="font-size:28px">Пароль управляющего</h1><div class="err" id="ae"></div><div style="font-size:36px;letter-spacing:10px;height:46px">${"•".repeat(v.length)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"✕",0,"⌫"].map(k=>`<button class="glass" data-k="${k}">${k}</button>`).join("")}</div><button class="btn glass" id="ac">Отмена</button></div></div>`;
      $("ac").onclick=()=>{$("ov").innerHTML="";res(false)};
      $("ov").querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
        const k=b.dataset.k;if(k==="✕")v="";else if(k==="⌫")v=v.slice(0,-1);else v+=k;
        if(v.length>=5&&(await sha(v))===PWH){$("ov").innerHTML="";res(true);return}
        if(v.length>=5){paint();$("ae").textContent="Неверный пароль";v="";return}
        paint();
      });
    };
    paint();
  });
}
async function staffEditor(){
  if(!(await adminPw()))return;
  const paint=()=>{
    const ids=Object.keys(L.staff).sort((a,b)=>(L.staff[a].o||0)-(L.staff[b].o||0));
    $("ov").innerHTML=`<div class="ov" style="align-items:flex-start;overflow:auto"><div class="box" style="width:min(94vw,640px);text-align:left"><h1 style="font-size:30px">Мастера</h1>
    ${ids.map(id=>`<div class="st"><input data-r="${id}" value="${esc(L.staff[id].n)}"><button class="btn r" data-del="${id}" style="padding:12px 18px">Удалить</button></div>`).join("")}
    <div class="st"><input id="nn" placeholder="Имя нового мастера"><button class="btn g" id="na" style="padding:12px 18px">Добавить</button></div>
    <button class="btn a" id="sd">Готово</button></div></div>`;
    $("sd").onclick=()=>{$("ov").innerHTML="";draw()};
    $("na").onclick=()=>{const n=$("nn").value.trim();if(!n)return;const id=newId();push({k:"st",id,d:{n,o:Date.now()}});paint()};
    $("ov").querySelectorAll("[data-r]").forEach(i=>i.onchange=()=>{const id=i.dataset.r,n=i.value.trim();if(n)push({k:"st",id,d:{...L.staff[id],n}})});
    $("ov").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Удалить мастера? Его записи в отчётах останутся."))  {push({k:"st",id:b.dataset.del,d:null});paint()}});
  };
  paint();
}
$("gear").onclick=staffEditor;

function start(){pull().then(()=>{draw();flush()})}
if(!key())login();else{start()}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
