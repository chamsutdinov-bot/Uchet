<body>
<div id="app"></div>

<script>
"use strict";
/* ===== настройки ===== */
const REPO="chamsutdinov-bot/uchet-data",KEYN="uchet_gh_m",ACC="access.json";
const PWH="d17f25ecfbcc7857f7bebea469308be0b2580943e96d13a3ad98a13675c4bfc2";
const STAGES=[["rasp","Распил"],["skl","Склейка"],["obr","Обработка и шлифовка"],["gotov","Готово к выдаче"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>{d=new Date(d);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const ymOf=d=>ymd(d).slice(0,7).replace("-","");
const hm=t=>{const d=new Date(t);return pad2(d.getHours())+":"+pad2(d.getMinutes())};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const key=()=>{try{return localStorage.getItem(KEYN)||""}catch(e){return""}};

/* ===== доступ к данным (GitHub) ===== */
const API="https://api.github.com/repos/"+REPO+"/contents/data/";
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
const H=x=>({Authorization:"Bearer "+key(),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(x||{})});
const cache={};
const tfetch=(u,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))};
async function load(c,force){
  const cur=cache[c],h=H();if(cur&&cur.etag&&!force)h["If-None-Match"]=cur.etag;
  const r=await tfetch(API+encodeURIComponent(c)+".json",{headers:h,cache:"no-store"});
  if(r.status===304)return{...cur,changed:false};
  if(r.status===404){const e={obj:{},sha:null,etag:null};const ch=!cur||Object.keys(cur.obj).length>0;cache[c]=e;return{...e,changed:ch}}
  if(r.status===401){const er=new Error("auth");er.auth=true;throw er}
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();let txt;
  if(j.content&&j.encoding==="base64")txt=b64d(j.content);
  else{const rr=await tfetch(API+encodeURIComponent(c)+".json",{headers:H({Accept:"application/vnd.github.raw+json"}),cache:"no-store"});txt=await rr.text()}
  let obj={};try{obj=JSON.parse(txt)||{}}catch(e){}
  const e={obj,sha:j.sha,etag:r.headers.get("ETag")};cache[c]=e;return{...e,changed:true};
}
const qMut={};
function mutate(c,fn){
  const run=async()=>{
    let last;
    for(let i=0;i<6;i++){
      const cur=await load(c,true),obj=JSON.parse(JSON.stringify(cur.obj));fn(obj);
      const body={message:"master: "+c,content:b64e(JSON.stringify(obj))};if(cur.sha)body.sha=cur.sha;
      const r=await tfetch(API+encodeURIComponent(c)+".json",{method:"PUT",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body),cache:"no-store"});
      if(r.ok){const j=await r.json();cache[c]={obj,sha:j.content.sha,etag:null};return}
      last=new Error("HTTP "+r.status);
      if(r.status===409||r.status===422){await new Promise(z=>setTimeout(z,300+Math.random()*500));continue}
      if(r.status===401){const er=new Error("auth");er.auth=true;throw er}
      break;
    }
    throw last||new Error("save");
  };
  const p=(qMut[c]||Promise.resolve()).then(run,run);qMut[c]=p.catch(()=>{});return p;
}

/* ===== данные и очередь записи ===== */
let staff={},orders={},stage={},logs={};          // базовые снимки с сервера
let pend=[];try{pend=JSON.parse(localStorage.getItem("m_q")||"[]")}catch(e){}
const savePend=()=>{try{localStorage.setItem("m_q",JSON.stringify(pend))}catch(e){}};
function deepMerge(t,s){for(const k in s){const v=s[k];if(v===null)delete t[k];else if(typeof v==="object"&&!Array.isArray(v)){if(typeof t[k]!=="object"||t[k]===null||Array.isArray(t[k]))t[k]={};deepMerge(t[k],v)}else t[k]=v}return t}
let L={staff:{},orders:{},stage:{},log:{}};     // с учётом ещё не отправленного
function rebuild(){
  L.staff=JSON.parse(JSON.stringify(staff));L.orders={...orders};L.stage=JSON.parse(JSON.stringify(stage));
  L.log={};for(const c in logs)Object.assign(L.log,logs[c]);
  for(const op of pend){
    if(op.k==="ev"){const o=L.log[op.id]||(L.log[op.id]={});Object.assign(o,op.d)}
    else if(op.k==="ms"){const t=L.stage[op.o]||(L.stage[op.o]={});deepMerge(t,op.m)}
    else if(op.k==="ms0"){delete L.stage[op.o]}
    else if(op.k==="st"){if(op.d===null)delete L.staff[op.id];else L.staff[op.id]=op.d}
  }
  for(const k in L.stage){if(!L.orders[k]&&L.stage[k].no)L.orders[k]={no:L.stage[k].no,fn:"",ln:"",v:1}}
}
let flushing=false,netErr="";
async function flush(){
  if(flushing||!pend.length)return;flushing=true;
  try{
    while(pend.length){
      const op=pend[0];
      if(op.k==="ev")await mutate("mlog_"+op.ym,o=>{o[op.id]={...(o[op.id]||{}),...op.d}});
      else if(op.k==="ms")await mutate("mstage",o=>{deepMerge(o[op.o]||(o[op.o]={}),op.m)});
      else if(op.k==="ms0")await mutate("mstage",o=>{delete o[op.o]});
      else if(op.k==="st")await mutate("mstaff",o=>{if(op.d===null)delete o[op.id];else o[op.id]=op.d});
      pend.shift();savePend();netErr="";
      if(cache.mstaff)staff=cache.mstaff.obj;if(cache.mstage)stage=cache.mstage.obj;if(op.k==="ev"&&cache["mlog_"+op.ym])logs[op.ym]=cache["mlog_"+op.ym].obj;
    }
  }catch(e){netErr=e.auth?"auth":"net";if(e.auth){try{localStorage.removeItem(KEYN)}catch(x){}login("Войдите снова")}}
  flushing=false;rebuild();paintSync();
}
function push(...ops){pend.push(...ops);savePend();rebuild();draw();paintSync();flush()}
function paintSync(){const n=pend.length;$("sync").textContent=n?(netErr?"Нет связи · в очереди: "+n:"Отправка…"):"";}
function evOp(d){const t=Date.now();return{k:"ev",ym:ymOf(t),id:newId(),d:{ts:t,d:ymd(t),...d}}}

/* ===== загрузка ===== */
const months=()=>{const n=new Date();const p=new Date(n.getFullYear(),n.getMonth()-1,1);return[ymOf(n),ymOf(p)]};
async function pull(){
  try{
    const m=months();
    const rs=await Promise.all([load("mstaff"),load("orders"),load("mstage"),load("mlog_"+m[0]),load("mlog_"+m[1])]);
    staff=rs[0].obj;orders=rs[1].obj;stage=rs[2].obj;logs={};logs[m[0]]=rs[3].obj;logs[m[1]]=rs[4].obj;
    saveSnap();
    if(rs.some(r=>r.changed)||true){rebuild();autoClose();draw()}
    netErr=pend.length?netErr:"";
  }catch(e){if(e.auth){try{localStorage.removeItem(KEYN)}catch(x){}login("Войдите снова")}else netErr="net"}
  paintSync();
}

/* ===== вычисления ===== */
const mEvents=(mid,d)=>Object.values(L.log).filter(e=>e.m===mid&&e.d===d).sort((a,b)=>a.ts-b.ts);
function dayState(mid,d){
  const ev=mEvents(mid,d).filter(e=>["in","out","autoout","inst_out"].includes(e.ty));
  const last=ev[ev.length-1];if(!last)return{s:"none"};
  if(last.ty==="in")return{s:"in",ts:last.ts};
  if(last.ty==="inst_out")return{s:"inst",ts:last.ts};
  return{s:"out",ts:last.ts,auto:last.ty==="autoout"};
}
function pendingConf(mid){
  const r=[];for(const o in L.stage){const i=L.stage[o].ins;if(i&&i.out&&i.out[mid]&&ymd(i.out[mid].ts)<ymd(Date.now())&&!(i.conf&&i.conf[mid]))r.push(o)}
  return r.filter(o=>L.orders[o]);
}
function curStage(o){const s=(L.stage[o]||{}).stages||{};for(const [k] of STAGES)if(!s[k])return k;return null}
function statusOf(o){
  const st=L.stage[o]||{},i=st.ins,s=st.stages||{};
  if(i&&i.status==="done")return["Установлен","ok"];
  if(i&&i.status==="tails")return["Хвосты","or"];
  if(i&&i.status==="out")return["На установке","bl"];
  const c=curStage(o);
  if(!c)return["Ждёт установки","a"];
  if(c==="rasp"&&!st.start)return["Не начат","n"];
  return[STAGES.find(x=>x[0]===c)[1],""];
}
const ordName=o=>{const x=L.orders[o]||{};return"№"+(x.no||"?")+" · "+((x.fn||"")+" "+(x.ln||"")).trim()};
const ordSub=o=>{const x=L.orders[o]||{};return[x.mt,x.sl?x.sl+" слэб.":"",x.date].filter(Boolean).join(" · ")};
function workOrders(){ // заказы, добавленные мастерами и ещё не закрытые установкой
  return Object.keys(L.stage).filter(o=>L.orders[o]).sort((a,b)=>(((L.stage[b]||{}).added||{}).ts||0)-(((L.stage[a]||{}).added||{}).ts||0));
}
function openOrders(q){
  const lim=Date.now()-120*864e5;q=(q||"").toLowerCase().trim();
  return Object.keys(L.orders).filter(o=>{
    const x=L.orders[o],s=L.stage[o];
    if(s&&s.ins&&s.ins.status==="done")return false;
    if(!s&&(x.us||(x.ts&&x.ts<lim)))return false;
    if(!q)return true;
    return((x.no||"")+" "+(x.fn||"")+" "+(x.ln||"")+" "+(x.ph||"")).toLowerCase().includes(q);
  }).sort((a,b)=>(L.orders[b].ts||0)-(L.orders[a].ts||0));
}

function autoClose(){

  const days={};
  Object.values(L.log).forEach(e=>{if(e.m&&e.d&&e.d<today)(days[e.m+"|"+e.d]=days[e.m+"|"+e.d]||[]).push(e)});
  for(const k in days){
    const ev=days[k].filter(e=>["in","out","autoout","inst_out"].includes(e.ty)).sort((a,b)=>a.ts-b.ts),last=ev[ev.length-1];
    if(last&&last.ty==="in"){

      ops.push({k:"ev",ym:ymOf(dt.getTime()-1),id:newId(),d:{m,d,ty:"autoout",ts:dt.getTime()-1}});

}

function fitGrid(){

function act(a,el){
  const m=V.m,today=ymd(Date.now());
  if(a==="home"){V={n:"home"};draw();return}
  if(a==="mback"){V={n:"master",m};draw();return}
  if(a==="arrive"){push(evOp({m,ty:"in"}));return}
  if(a==="leave"){push(evOp({m,ty:"out"}));V={n:"home"};draw();return}
  if(a==="open"){V={n:"order",m,o:el.dataset.o};draw();return}
  if(a==="back"){V={n:"master",m};draw();return}
  if(a==="addo"){showAdd(m);return}
  if(a==="instone"){V.sel={[el.dataset.o]:1};return act("instgo",el)}
  if(a==="inst"){V={n:"inst",m,sel:{}};q="";draw();return}
  if(a==="pick"){const o=el.dataset.o;if(V.sel[o])delete V.sel[o];else V.sel[o]=1;draw();return}
  if(a==="instgo"){
    const ops=[];const t=Date.now();
    for(const o of Object.keys(V.sel)){
      const i=(L.stage[o]||{}).ins;
      ops.push(evOp({m,ty:"inst_out",o}));
      if(i&&i.status==="tails")ops.push({k:"ms",o,m:{ins:null}});
      const fresh=!i||i.status==="tails";
      ops.push({k:"ms",o,m:{ins:{status:"out",round:fresh?((i&&i.round)||0)+1:((i&&i.round)||1),out:{[m]:{ts:t}}}}});
      if(i&&i.status==="tails")ops.push({k:"ms",o,m:{ins:{conf:null}}});
    }
    push(...ops);V={n:"home"};draw();return;
  }
  if(a==="conf"||a==="tailsgo"){
    const o=a==="conf"?el.dataset.o:V.o,full=a==="conf",note=a==="tailsgo"?($("tn").value||"").trim():"";
    const i=(L.stage[o]||{}).ins||{},conf={...(i.conf||{}),[m]:{ts:Date.now(),full,note}};
    const outs=Object.keys(i.out||{}),ks=outs.length?outs:Object.keys(conf),all=ks.every(x=>conf[x]);
    const status=all?(ks.every(x=>conf[x].full)?"done":"tails"):"out";
    push(evOp({m,ty:"inst_conf",o,full,note}),{k:"ms",o,m:{ins:{conf:{[m]:{ts:Date.now(),full,note}},status}}});
    V={n:"master",m};draw();return;
  }
  if(a==="rs"){const t=$("tn"),x=el.dataset.t;if(!t.value.includes(x))t.value=(t.value.trim()?t.value.trim()+", ":"")+x;return}
  if(a==="tails"){V={n:"tails",m,o:el.dataset.o};draw();return}
  if(a==="start"){const o=V.o,t=Date.now();push(evOp({m,ty:"start",o}),{k:"ms",o,m:{start:{ts:t,m}}});return}
  if(a==="stage"){const o=V.o,k=el.dataset.k,t=Date.now();
    push(evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{stages:{[k]:{ts:t,m}}}});
    if(k==="gotov"){V={n:"master",m};draw()}return}
  if(a==="qstage"){const o=el.dataset.o,k=el.dataset.k,t=Date.now(),st=L.stage[o]||{};
    if(k==="rasp"&&!st.start)push(evOp({m,ty:"start",o}),evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{start:{ts:t,m},stages:{[k]:{ts:t,m}}}});
    else push(evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{stages:{[k]:{ts:t,m}}}});
    return}
  if(a==="undo"){const o=V.o,k=el.dataset.k;push(evOp({m,ty:"unstage",o,st:k}),{k:"ms",o,m:{stages:{[k]:null}}});return}
}

/* свайп вниз = обновить всё: версия приложения + данные */
const ptr=$("ptr");let pty=null,ppull=0,pbusy=false;
const hidePtr=()=>{ptr.style.transition="";ptr.style.transform="translate(-50%,-70px)";ptr.style.opacity=0};
async function refreshAll(){
  pbusy=true;ptr.style.transition="";ptr.textContent="Обновляю…";ptr.style.transform="translate(-50%,14px)";ptr.style.opacity=1;
  try{
    try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}),j=await r.json();
      if(j&&j.b&&j.b!==BUILD){ptr.textContent="Новая версия…";location.replace(location.pathname+"?v="+j.b);return}}catch(e){}
    await flush();await pull();draw();
    ptr.textContent=netErr?"Нет связи — данные сохранены":"Обновлено";
  }catch(e){ptr.textContent="Не удалось обновить"}
  setTimeout(()=>{hidePtr();pbusy=false},800);
}
addEventListener("touchstart",e=>{pty=(scrollY<=1&&!pbusy&&!$("ov").innerHTML.trim())?e.touches[0].clientY:null;ppull=0},{passive:true});
addEventListener("touchmove",e=>{
  if(pty==null)return;ppull=Math.max(0,e.touches[0].clientY-pty);
  if(ppull>0){const d=Math.min(ppull*.5,64);ptr.style.transition="none";ptr.textContent=d>=48?"Отпустите для обновления":"Потяните вниз";ptr.style.transform="translate(-50%,"+(d-40)+"px)";ptr.style.opacity=Math.min(1,d/36)}
},{passive:true});
addEventListener("touchend",()=>{if(pty==null)return;const go=ppull*.5>=48;pty=null;ppull=0;if(go)refreshAll();else hidePtr()});
addEventListener("touchcancel",()=>{pty=null;ppull=0;hidePtr()});

/* автообновление: раз в минуту проверяем версию, при новой — тихо перезагружаем */
function autoUpd(){
  if(document.hidden||$("ov").innerHTML.trim()||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.b||j.b===BUILD)return;
    let g="";try{g=sessionStorage.getItem("m_upd")||""}catch(e){}
    const now=Date.now(),[gb,gt]=g.split("|");
    if(gb===j.b&&now-(+gt||0)<300000)return;
    try{sessionStorage.setItem("m_upd",j.b+"|"+now)}catch(e){}
    location.replace(location.pathname+"?v="+j.b);
  }).catch(()=>{});
}
setInterval(autoUpd,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoUpd()});
setInterval(()=>{if(!document.hidden&&key()){pull();flush()}},8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&key()){pull();flush()}});
addEventListener("online",()=>{flush();pull()});

/* ===== вход (один раз на планшете) и настройки ===== */
async function openAccess(A,pw){
  try{
    const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(A.s),iterations:A.i||300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(A.v)},k,b(A.c)));
  }catch(e){return null}
}
function login(msg){
  $("ov").innerHTML=`<div class="ov"><div class="box"><h1 style="font-size:32px">Цех · Interstone</h1><div class="hint">Введите пароль доступа. Это нужно один раз на этом планшете.</div><input id="lp" type="password" inputmode="numeric" placeholder="Пароль" autocomplete="off"><div class="err" id="le">${esc(msg||"")}</div><button class="btn a" id="lg">Войти</button></div></div>`;
  const go=async()=>{
    const pw=$("lp").value.trim();if(!pw)return;$("le").textContent="Проверяю…";
    try{
      const ar=await fetch(ACC,{cache:"no-store"});const t=await openAccess(await ar.json(),pw);
      if(!t){$("le").textContent="Неверный пароль";return}
      const r=await fetch("https://api.github.com/repos/"+REPO,{headers:{Authorization:"Bearer "+t},cache:"no-store"});
      if(!r.ok){$("le").textContent="Нет доступа к базе ("+r.status+")";return}
      localStorage.setItem(KEYN,t);$("ov").innerHTML="";start();
    }catch(e){$("le").textContent="Нет связи. Проверьте интернет"}
  };
  $("lg").onclick=go;$("lp").onkeydown=e=>{if(e.key==="Enter")go()};
}
function adminPw(){
  return new Promise(res=>{
    let v="";
    const paint=()=>{$("ov").innerHTML=`<div class="ov"><div class="box"><h1 style="font-size:28px">Пароль управляющего</h1><div class="err" id="ae"></div><div style="font-size:36px;letter-spacing:10px;height:46px">${"•".repeat(v.length)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"✕",0,"⌫"].map(k=>`<button class="glass" data-k="${k}">${k}</button>`).join("")}</div><button class="btn glass" id="ac">Отмена</button></div></div>`;
      $("ac").onclick=()=>{$("ov").innerHTML="";res(false)};
      $("ov").querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
        const k=b.dataset.k;if(k==="✕")v="";else if(k==="⌫")v=v.slice(0,-1);else v+=k;
        if(v.length>=5&&(await sha(v))===PWH){$("ov").innerHTML="";res(true);return}
        if(v.length>=5){paint();$("ae").textContent="Неверный пароль";v="";return}
        paint();
      });
    };
    paint();
  });
}
async function staffEditor(){
  const paint=()=>{
    const ids=Object.keys(L.staff).sort((a,b)=>(L.staff[a].o||0)-(L.staff[b].o||0));
    $("ov").innerHTML=`<div class="ov"><div class="box" style="width:min(94vw,720px);text-align:left;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 style="font-size:28px;margin:0">Мастера</h1><button class="btn a" id="sd" style="padding:10px 22px">Готово</button></div>
    <div class="mg">${ids.map(id=>`<div class="mt"><input data-r="${id}" value="${esc(L.staff[id].n)}"><button class="x" data-del="${id}" title="Удалить">✕</button></div>`).join("")}</div>
    <button class="btn g" id="na">＋ Добавить мастера</button></div></div>`;
    $("sd").onclick=()=>{$("ov").innerHTML="";draw()};
    $("na").onclick=addForm;
    $("ov").querySelectorAll("[data-r]").forEach(i=>i.onchange=()=>{const id=i.dataset.r,n=i.value.trim();if(n)push({k:"st",id,d:{...L.staff[id],n}})});
    $("ov").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!(await adminPw())){paint();return}push({k:"st",id:b.dataset.del,d:null});paint()});
  };
  const addForm=()=>{
    $("ov").innerHTML=`<div class="ov"><div class="box" style="width:min(92vw,460px)"><h1 style="font-size:28px">Добавить мастера</h1><input id="nn" placeholder="Имя мастера" autocomplete="off" style="text-align:center;font-size:24px;padding:16px"><button class="btn g" id="ng">Добавить</button><button class="btn glass" id="nc">Отмена</button></div></div>`;
    $("nc").onclick=paint;
    const go=async()=>{const n=$("nn").value.trim();if(!n)return;if(!(await adminPw())){addForm();$("nn").value=n;return}const id=newId();push({k:"st",id,d:{n,o:Date.now()}});paint()};
    $("ng").onclick=go;$("nn").onkeydown=e=>{if(e.key==="Enter")go()};
    setTimeout(()=>$("nn").focus(),50);
  };
  paint();
}
$("gear").onclick=staffEditor;

const SNAPK="m_snap";
function saveSnap(){try{const o={};for(const k in orders){const x=orders[k];o[k]={no:x.no,fn:x.fn,ln:x.ln,mt:x.mt,sl:x.sl,date:x.date,ts:x.ts,us:x.us}}localStorage.setItem(SNAPK,JSON.stringify({staff,orders:o,stage,logs}))}catch(e){}}
function loadSnap(){try{const j=JSON.parse(localStorage.getItem(SNAPK)||"null");if(j){staff=j.staff||{};orders=j.orders||{};stage=j.stage||{};logs=j.logs||{}}}catch(e){}}
function start(){loadSnap();rebuild();draw();pull().then(()=>{draw();flush()})}
if(!key())login();else{start()}
